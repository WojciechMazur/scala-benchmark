version = "3.11.5"
runner.dialect = scala3
maxColumn = 120

# Scala 3 syntax: `if ... then`, `*` imports and significant indentation.
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = yes
rewrite.scala3.insertEndMarkerMinLines = 30
rewrite.scala3.removeEndMarkerMaxLines = 29

rewrite.rules = [Imports, RedundantBraces, RedundantParens, SortModifiers]
rewrite.imports.sort = scalastyle
rewrite.imports.groups = [
  ["java\\..*", "javax\\..*"],
  ["scala\\..*"],
  [".*"]
]

# One blank line around definitions that span several lines.
newlines.topLevelStatementBlankLines = [
  { blanks = 1 }
]
newlines.source = keep

docstrings.style = SpaceAsterisk
docstrings.wrap = keep

project.excludePaths = ["glob:**/target/**"]
