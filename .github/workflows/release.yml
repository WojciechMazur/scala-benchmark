name: Release
# A `v<major>.<minor>.<patch>` tag publishes that version to Maven Central (see "Releasing" in CONTRIBUTING.md).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # sbt-dynver derives the version from the tag and needs the history to find it.
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Sign, upload and release
        # `--server`: the thin client can exit with status 0 when the command fails.
        run: sbt --server --batch ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
