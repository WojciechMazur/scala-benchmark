name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  COMPATIBILITY: >-
    benchmark/platform benchmark/reports benchmark/api benchmark/configuration benchmark/result-extensions
    benchmark/formatters benchmark/output-factory benchmark/stdio benchmark/aggregation
  EXECUTION: >-
    benchmark/runner-failures benchmark/fork-sequence benchmark/execution benchmark/output-format
jobs:
  unit:
    name: Formatting, compilation and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
      - name: Check formatting
        run: scalafmt --check
      - name: Compile every module and platform; run unit tests
        run: >-
          sbt --batch "runtimeJVM/test;
          examplesJVM/Jmh/compile;
          examplesNative/Jmh/compile;
          examplesJS/Jmh/compile;
          sbtPlugin/compile"
      - name: Check host process supervision
        run: node --test sbt-plugin/src/test/node/*.test.mjs

  # Every scripted test builds one project per platform. The JVM always runs first: upstream JMH is the reference
  # that the other platforms are compared with.
  compatibility:
    name: Compatibility (${{ matrix.platform }}, ${{ matrix.os }}, LTO ${{ matrix.lto || 'none' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: native
            os: ubuntu-22.04
          - platform: js
            os: ubuntu-22.04
          - platform: native
            os: macos-15
          - platform: native
            os: windows-2022
          - platform: native
            os: windows-2022
            lto: thin
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: ${{ matrix.platform == 'native' && 'true' || 'false' }}
      - uses: actions/setup-node@v6
        if: matrix.platform == 'js'
        with:
          node-version: '25'
      - name: Compare the public behaviour with the JVM
        shell: bash
        env:
          SCALANATIVE_LTO: ${{ matrix.lto || 'none' }}
        run: sbt --batch -Dbenchmark.platforms=jvm,${{ matrix.platform }} "sbtPlugin/scripted $COMPATIBILITY"

  execution:
    name: Execution and failure parity (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [native, js]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: ${{ matrix.platform == 'native' && 'true' || 'false' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
      - name: Compare failures and execution with the JVM
        run: >-
          sbt --batch -Dbenchmark.platforms=jvm,${{ matrix.platform }}
          "sbtPlugin/scripted $EXECUTION benchmark/containment benchmark/group-failures"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: execution-parity-${{ matrix.platform }}
          path: target/execution-parity

  # Wasm shares the Scala.js runtime and host; only the linked code differs, which the integrity test inspects.
  integrity:
    name: Optimized measurement integrity (${{ matrix.platform }}, LTO ${{ matrix.lto || 'none' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: native
          - platform: native
            lto: thin
          - platform: native
            lto: full
          - platform: js
          - platform: wasm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: ${{ matrix.platform == 'native' && 'true' || 'false' }}
      - uses: actions/setup-node@v6
        if: matrix.platform != 'native'
        with:
          node-version: '25'
      - name: Inspect optimized workloads with collection enabled
        env:
          SCALANATIVE_LTO: ${{ matrix.lto || 'none' }}
        run: sbt --batch -Dbenchmark.platforms=${{ matrix.platform }} "sbtPlugin/scripted benchmark/integrity"
      - name: Check platform selection on Wasm
        if: matrix.platform == 'wasm'
        run: sbt --batch -Dbenchmark.platforms=wasm "sbtPlugin/scripted benchmark/platform"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: optimized-integrity-${{ matrix.platform }}-${{ matrix.lto || 'none' }}
          path: target/execution-parity/integrity
