name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# `sbt --server`: sbt 2's thin client cannot start its server on Windows, and still exits with status 0.
env:
  COMPATIBILITY: >-
    microbench/platform microbench/reports microbench/api microbench/configuration microbench/result-extensions
    microbench/formatters microbench/output-factory microbench/stdio microbench/aggregation
  EXECUTION: >-
    microbench/runner-failures microbench/fork-sequence microbench/execution microbench/output-format
jobs:
  unit:
    name: Formatting, compilation and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
      - name: Check formatting
        run: scalafmt --check
      - name: Compile every module and platform; run unit tests
        run: >-
          sbt --server --batch "runtime/test;
          examples/Jmh/compile;
          examplesNative/Jmh/compile;
          examplesJS/Jmh/compile;
          sbtPlugin/compile"
      - name: Use the libraries from the latest LTS and the latest release candidate
        run: >-
          sbt --server --batch "scriptedOn jvm,native,js scala=3.lts microbench/api;
          scriptedOn jvm,native,js scala=3.rc microbench/api"
      - name: Check host process supervision
        run: node --test sbt-plugin/src/test/node/*.test.mjs

  scala-cli:
    name: scala-cli entry point (Scala ${{ matrix.scala }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            scala: 3.lts
          - os: ubuntu-latest
            scala: 3.rc
          - os: macos-latest
            scala: 3.lts
          # windows-latest ships MSVC 14.52, whose STL requires Clang 22; the setup action pins LLVM 20.
          - os: windows-2022
            scala: 3.lts
    env:
      RUN: >-
        scala-cli run examples/scala-cli --scala ${{ matrix.scala }}
      BENCHMARK: >-
        LifecycleBenchmark.sum -p size=16 -wi 0 -i 1 -r 100ms -f 1
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: 'true'
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
      - uses: VirtusLab/scala-cli-setup@v1.19.0
      - name: Publish the libraries locally
        run: sbt --server --batch +publishLocal
      - name: List the benchmarks
        if: runner.os == 'Linux'
        run: |
          ${{ env.RUN }} --platform jvm -- -l
          ${{ env.RUN }} --platform scala-native -- -l
          ${{ env.RUN }} --platform scala-js -- -l
      - name: Run on the JVM
        run: ${{ env.RUN }} --platform jvm -- ${{ env.BENCHMARK }} -rf json -rff result-jvm.json
      - name: Run on Scala Native
        run: ${{ env.RUN }} --platform scala-native -- ${{ env.BENCHMARK }} -rf json -rff result-native.json
      - name: Run on Scala.js
        run: ${{ env.RUN }} --platform scala-js -- ${{ env.BENCHMARK }} -rf json -rff result-js.json

  # Every scripted test builds one project per platform. The JVM always runs first: upstream JMH is the reference
  # that the other platforms are compared with.
  compatibility:
    name: Compatibility (${{ matrix.platform }}, ${{ matrix.os }}, LTO ${{ matrix.lto || 'none' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: native
            os: ubuntu-latest
          - platform: js
            os: ubuntu-latest
          - platform: native
            os: macos-15
          - platform: native
            os: windows-2022
          - platform: native
            os: windows-2022
            lto: thin
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: ${{ matrix.platform == 'native' && 'true' || 'false' }}
      - uses: actions/setup-node@v6
        if: matrix.platform == 'js'
        with:
          node-version: '25'
      - name: Compare the public behaviour with the JVM
        shell: bash
        env:
          SCALANATIVE_LTO: ${{ matrix.lto || 'none' }}
        run: sbt --server --batch "scriptedOn jvm,${{ matrix.platform }} $COMPATIBILITY"

  execution:
    name: Execution and failure parity (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: [native, js]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: ${{ matrix.platform == 'native' && 'true' || 'false' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
      - name: Compare failures and execution with the JVM
        run: >-
          sbt --server --batch "scriptedOn jvm,${{ matrix.platform }} $EXECUTION microbench/containment microbench/group-failures"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: execution-parity-${{ matrix.platform }}
          path: target/execution-parity

  # Wasm shares the Scala.js runtime and host; only the linked code differs, which the integrity test inspects.
  integrity:
    name: Optimized measurement integrity (${{ matrix.platform }}, LTO ${{ matrix.lto || 'none' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: native
          - platform: native
            lto: thin
          - platform: native
            lto: full
          - platform: js
          - platform: wasm
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          native: ${{ matrix.platform == 'native' && 'true' || 'false' }}
      - uses: actions/setup-node@v6
        if: matrix.platform != 'native'
        with:
          node-version: '25'
      - name: Inspect optimized workloads with collection enabled
        env:
          SCALANATIVE_LTO: ${{ matrix.lto || 'none' }}
        run: sbt --server --batch "scriptedOn ${{ matrix.platform }} microbench/integrity"
      - name: Check platform selection on Wasm
        if: matrix.platform == 'wasm'
        run: sbt --server --batch "scriptedOn wasm microbench/platform"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: optimized-integrity-${{ matrix.platform }}-${{ matrix.lto || 'none' }}
          path: target/execution-parity/integrity
